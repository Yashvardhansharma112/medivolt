services:
  - type: web
    name: medivault-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  - type: web
    name: medivault-predict
    runtime: docker
    rootDir: predict
    envVars:
      - key: GEMINI_API_KEY
        sync: false
